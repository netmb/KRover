[platformio]
default_envs = waveshare-esp32-s3-zero

[env:waveshare-esp32-s3-zero]
platform = espressif32@7.0.1
board = waveshare_esp32_s3_zero
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DKATASTER_IMU_SDA=8
    -DKATASTER_IMU_SCL=9
    -DKATASTER_LG290P_RX=7
    -DKATASTER_LG290P_TX=10
    -DKATASTER_LG290P_BAUD=460800
    -DKATASTER_GNSS_SIMULATION=0
build_unflags =
    -std=gnu++11

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<rtcm_parser.cpp>
    +<imu_processor.cpp>
    -<main.cpp>
build_flags =
    -std=c++17
